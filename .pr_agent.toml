# Shared PR-Agent (qodo-ai/pr-agent v0.48.0) configuration for
# mastro993/gta-lunigiana, mastro993/xbase, mastro993/crumble and
# mastro993/SkillBinder. Keep this file byte-identical across those repositories.
#
# Prompt caching is intentionally off: litellm.cache_control_injection_points
# stays []. Single-shot /review and /improve calls do not reuse a stable prefix
# across PRs, so cache writes would add cost without a matching read.

[config]
# Sonnet is the primary reviewer; Opus is fallback-only on primary failure.
model = "anthropic/claude-sonnet-5"
fallback_models = ["anthropic/claude-opus-5-5"]
ai_timeout = 180
max_model_tokens = 64000
publish_output_progress = false
response_language = "en-US"
# Extended / adaptive thinking stay off so reviews do not spend tokens on reasoning.
enable_claude_extended_thinking = false
enable_claude_adaptive_thinking = false
ignore_pr_source_branches = ["^dependabot/", "^renovate/"]

[github_action_config]
auto_review = true
auto_improve = true
auto_describe = false
pr_actions = ["opened", "reopened", "ready_for_review"]
handle_push_trigger = true
push_commands = ["/review"]

[pr_reviewer]
require_score_review = false
require_tests_review = true
require_estimate_effort_to_review = false
require_security_review = true
require_merge_recommendation = true
num_max_findings = 4
enable_review_labels_effort = false
enable_review_labels_security = true
# Chunking multiplies review calls; keep it off to cap cost.
enable_large_pr_chunking = false
max_number_of_calls = 2
extra_instructions = """
Focus on bugs, security issues, correctness, and missing tests. Skip style, formatting, naming, and lint nits that linters or formatters already cover. Be concrete: cite file paths and line numbers, and explain the failure mode. Reply in English.
"""

[pr_code_suggestions]
committable_code_suggestions = false
focus_only_on_problems = true
num_code_suggestions_per_chunk = 2
suggestions_score_threshold = 7
max_number_of_calls = 2
extra_instructions = """
Suggest only high-value changes that fix bugs, security issues, correctness, or missing tests. Skip style, formatting, naming, and lint nits that linters or formatters already cover. Be concrete: cite file paths and line numbers, and show the intended change. Reply in English.
"""

[litellm]
cache_control_injection_points = []

[ignore]
glob = [
  # Lockfiles
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/yarn.lock",
  "**/bun.lock",
  "**/bun.lockb",
  "**/npm-shrinkwrap.json",
  "**/Cargo.lock",
  "**/Podfile.lock",
  "**/pubspec.lock",
  "**/poetry.lock",
  "**/composer.lock",
  "**/Gemfile.lock",
  "**/go.sum",
  "**/flake.lock",
  "**/uv.lock",
  "**/Pipfile.lock",
  "**/mix.lock",
  "**/.terraform.lock.hcl",
  # Vendored
  "**/node_modules/**",
  "**/vendor/**",
  "**/third_party/**",
  # Generated / build output
  "**/dist/**",
  "**/build/**",
  "**/out/**",
  "**/target/**",
  "**/.next/**",
  "**/coverage/**",
  "**/generated/**",
  "**/*.min.js",
  "**/*.min.css",
  "**/*.map",
  # Snapshots
  "**/__snapshots__/**",
  "**/*.snap",
  # Binary / assets
  "**/*.png",
  "**/*.jpg",
  "**/*.jpeg",
  "**/*.gif",
  "**/*.webp",
  "**/*.ico",
  "**/*.pdf",
  "**/*.mp3",
  "**/*.mp4",
  "**/*.webm",
  "**/*.wav",
  "**/*.woff",
  "**/*.woff2",
  "**/*.ttf",
  "**/*.otf",
  "**/*.eot",
  "**/*.bin",
  "**/*.wasm",
]
