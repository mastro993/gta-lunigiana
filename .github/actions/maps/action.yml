# Puts the built maps in src/sim/map for the steps after it: from the cache when their inputs are
# unchanged, else built from the raw inputs data/raw.lock.json pins, which come through a cache of
# their own. It never saves the maps: ci.yml's reproducible job does, once a second build matches.
# Runs after Node, pnpm and the dependencies are installed (ci.yml, pages.yml).
name: Maps
description: Restore the built maps from the cache, or fetch the pinned raw inputs and build them
inputs:
  restore:
    description: '"false" builds the maps even when the cache holds them'
    default: "true"
outputs:
  key:
    description: The maps' cache key
    value: ${{ steps.key.outputs.key }}
  hash:
    description: SHA-256 of the built map files gunzipped, in path order; empty when they came from the cache
    value: ${{ steps.hash.outputs.hash }}
runs:
  using: composite
  steps:
    # A hash of everything the build reads: the raw lock, the package files and every source file
    # build-map.ts imports (src/tools/map-key.ts). The Node version is in it too: the two builds
    # ci.yml's reproducible job compares run the same Node, so a new one is built and checked again.
    # The architecture is not: the build gives the same bytes on arm64 and x64 (docs/map.md), and the
    # x64 check job restores what the arm64 reproducible job saved. Each is assigned on its own line,
    # so a failure fails the step instead of leaving a part of the key empty.
    - id: key
      shell: bash
      run: |
        key=$(node src/tools/map-key.ts)
        node=$(node --version)
        echo "key=maps-${{ runner.os }}-$node-$key" >> "$GITHUB_OUTPUT"

    - id: maps
      if: inputs.restore == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          src/sim/map/*.bin
          src/sim/map/*/*.bin
        key: ${{ steps.key.outputs.key }}

    - id: raw
      if: steps.maps.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: data/raw
        key: raw-${{ hashFiles('data/raw.lock.json') }}

    # Downloads only what the cache lacks, and checks every file's SHA-256 either way.
    - if: steps.maps.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm fetch-raw
      env:
        GH_TOKEN: ${{ github.token }}

    # Every file was just checked against the lock, so the raw cache is safe to save here.
    - if: steps.maps.outputs.cache-hit != 'true' && steps.raw.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: data/raw
        key: ${{ steps.raw.outputs.cache-primary-key }}

    - if: steps.maps.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm maps

    # Gunzipped, so the hash is the same wherever the build ran (another zlib compresses differently).
    - id: hash
      if: steps.maps.outputs.cache-hit != 'true'
      shell: bash
      run: |
        hash=$(find src/sim/map -name '*.bin' -print0 | LC_ALL=C sort -z | xargs -0 gunzip -c | sha256sum)
        echo "hash=${hash%% *}" >> "$GITHUB_OUTPUT"
