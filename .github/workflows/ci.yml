name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      # Set only when this job built the maps, for the reproducible job to compare against.
      maps-hash: ${{ steps.maps.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The steps of `pnpm check`, one per step so a failure names its gate; lint and the tests read
      # the built maps.
      - run: pnpm format:check
      - run: pnpm typecheck
      - id: maps
        uses: ./.github/actions/maps
      - run: pnpm lint
      - run: pnpm test

  # When the check job built the maps (their inputs changed), build them again on an arm64 runner
  # (the check job's is x64): the two builds must gunzip to the same bytes. Only then are the maps
  # cached, so every new set of inputs is checked once, however often its run is re-run.
  reproducible:
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.maps-hash != '' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: maps
        uses: ./.github/actions/maps
        with:
          restore: "false"

      - name: Compare with the check job's build
        env:
          FIRST: ${{ needs.check.outputs.maps-hash }}
          SECOND: ${{ steps.maps.outputs.hash }}
        run: |
          echo "check job (x64):  $FIRST"
          echo "this job (arm64): $SECOND"
          if [ "$FIRST" != "$SECOND" ]; then
            echo "::error::The x64 and arm64 builds of the maps differ: the map build is not deterministic"
            exit 1
          fi

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/sim/map/*.bin
            src/sim/map/*/*.bin
          key: ${{ steps.maps.outputs.key }}
