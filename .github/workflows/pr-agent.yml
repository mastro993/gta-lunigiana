name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-agent:
    # Reviews every PR when it opens, and answers `/review`, `/improve`, `/ask …` comments.
    # Drafts wait for `ready_for_review`. Bot PRs (dependabot, renovate) are skipped. Fork
    # PRs, which get no secrets, wait for a `/review` comment from a repo collaborator.
    # Other comments never start the job. PR-Agent reads the diff through the API and never
    # checks out the PR's code. Model, tool, and ignore settings live in `.pr_agent.toml`
    # (single source of truth; not duplicated here).
    if: >-
      github.event.sender.type != 'Bot' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      ((github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The action's own Dockerfile pulls a rolling tag, so pin the release image (0.48.0) by digest.
      - uses: docker://pragent/pr-agent@sha256:80edef71baa3df28c129d858d4b53784abfc14704c235efb32b6c461d5399a6d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_API_KEY }}
